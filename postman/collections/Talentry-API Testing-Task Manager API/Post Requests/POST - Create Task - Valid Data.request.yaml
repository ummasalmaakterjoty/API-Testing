$kind: http-request
url: "{{baseUrl}}/tasks"
method: POST
body:
  type: json
  content: '{"title":"Write report","description":"Finish API report","status":"todo","priority":"high"}'
auth:
  type: bearer
  credentials:
    token: "{{token}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Task created\", function () {\r

      \  pm.response.to.have.status(201);\r

      });\r

      pm.environment.set(\"taskId\", pm.response.json().id);"
    language: text/javascript
order: 1000
