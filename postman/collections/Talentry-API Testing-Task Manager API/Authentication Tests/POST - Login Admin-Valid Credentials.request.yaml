$kind: http-request
url: "{{baseUrl}}/auth/login"
method: POST
body:
  type: json
  content: '{"email":"admin@example.com","password":"Admin123!"}'
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \  pm.response.to.have.status(200);\r

      });\r

      pm.environment.set(\"adminToken\", pm.response.json().token);"
    language: text/javascript
order: 5000
