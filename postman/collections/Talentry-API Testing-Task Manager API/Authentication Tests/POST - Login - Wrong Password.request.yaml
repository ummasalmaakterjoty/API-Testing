    code: "pm.test(\"Status code is 401\", function () {\r

      \  pm.response.to.have.status(401);\r

      });\r

      pm.test(\"Error message is returned\", function () {\r

      \  pm.expect(pm.response.json()).to.have.property(\"message\");\r

      });"
    language: text/javascript
